name: Release

# Builds Healer's Linux binaries and publishes them as a GitHub Release whenever you push a version
# tag (e.g. `v1.0.0`). This exists specifically because Native AOT for linux-x64/linux-arm64 must be
# built ON Linux — a Windows dev machine cannot cross-compile it — so this workflow does that part
# on GitHub-hosted Linux runners instead. See docs/DEPLOY-FROM-WINDOWS.md for the full walkthrough.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for each architecture — no cross-compilation, which is the more fragile
          # path for Native AOT. If your plan/account doesn't have arm64 runners available, just
          # delete the linux-arm64 entry below; bootstrap.sh only complains if a box's architecture
          # has no matching download, so shipping x64-only is a safe, valid choice too.
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish Healer.Host (Native AOT)
        run: >
          dotnet publish src/Healer.Host -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishAot=true -o publish/host

      - name: Publish Healer.Setup
        # PublishSingleFile + IncludeNativeLibrariesForSelfExtract, matching deploy/build-deb.sh —
        # without these, "--self-contained true" alone produces ~220 loose files (the apphost plus
        # every runtime/dependency DLL and native library), and packaging only the named executable
        # (as this step used to) ships a binary missing everything it needs to actually run. This
        # exact gap shipped once already and broke a real install ("The application to execute does
        # not exist: '/opt/healer/healer-setup.dll'") before being caught here.
        run: >
          dotnet publish src/Healer.Setup -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/setup

      - name: Publish Healer.Status
        run: >
          dotnet publish src/Healer.Status -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/status

      - name: Package release tarball
        run: |
          set -e
          STAGE="$(mktemp -d)"

          cp publish/host/healer "$STAGE/"
          # Native AOT only compiles MANAGED code to native — SQLite's C library does NOT get
          # folded into the single `healer` executable and still ships as its own .so file next to
          # it. Missing this is exactly what caused "sqlite error 14: unable to open database file"
          # at runtime the first time this was packaged for the .deb path (see docs/ARCHITECTURE.md).
          cp publish/host/libe_sqlite3.so "$STAGE/"
          chmod 755 "$STAGE/libe_sqlite3.so"

          # healer-setup/healer-status are PublishSingleFile + IncludeNativeLibrariesForSelfExtract
          # bundles — at every run they need to extract their native libraries to a writable
          # directory, and .NET's automatic fallback search for that directory (HOME, TMPDIR, etc.)
          # is not reliable across the different contexts these run in (root via bootstrap.sh, a
          # plain sudo shell, healer-first-run.sh). Pin an explicit, always-writable extraction
          # directory instead: rename the real executables to `.bin` and ship a thin wrapper script
          # under the original name that sets DOTNET_BUNDLE_EXTRACT_BASE_DIR before exec-ing it —
          # the same fix already proven in deploy/build-deb.sh.
          mkdir -p "$STAGE/.extract"
          chmod 1777 "$STAGE/.extract"
          cp publish/setup/healer-setup "$STAGE/healer-setup.bin"
          cp publish/status/healer-status "$STAGE/healer-status.bin"
          chmod 755 "$STAGE/healer-setup.bin" "$STAGE/healer-status.bin"
          for name in healer-setup healer-status; do
            printf '#!/bin/sh\nexport DOTNET_BUNDLE_EXTRACT_BASE_DIR="/opt/healer/.extract"\nexec "/opt/healer/%s.bin" "$@"\n' "$name" > "$STAGE/$name"
          done

          cp deploy/healer.service "$STAGE/"
          cp deploy/healer-first-run.sh "$STAGE/"
          chmod +x "$STAGE/healer" "$STAGE/healer-setup" "$STAGE/healer-status" "$STAGE/healer-first-run.sh"
          mkdir -p dist
          tar -czf "dist/healer-${{ matrix.rid }}.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: healer-${{ matrix.rid }}
          path: dist/healer-${{ matrix.rid }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout MUST run before download-artifact: checkout defaults to `clean: true`,
      # which runs `git clean -ffdx` on the workspace before checking out — that wipes any
      # untracked files already there, including a dist/ directory download-artifact had just
      # populated, if checkout ran second. This exact ordering bug was the cause of a real CI
      # failure ("find: 'dist': No such file or directory") — download-artifact succeeded, but
      # checkout silently deleted its output one step later.
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run the test suite one more time before publishing
        run: dotnet test Healer.slnx

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Downloaded artifact layout:"
          find dist -type f
          mapfile -t TARBALLS < <(find dist -type f -name '*.tar.gz')
          if [ "${#TARBALLS[@]}" -eq 0 ]; then
            echo "::error::No .tar.gz files found anywhere under dist/ — see the file listing above." >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" "${TARBALLS[@]}" --title "${{ github.ref_name }}" --generate-notes
